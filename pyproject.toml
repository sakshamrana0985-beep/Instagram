[project]
name = "recall"
version = "0.1.0"
description = "Telegram bot that turns saved social videos into searchable notes."
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=21.0",
    "supabase>=2.4.0",
    "pydantic>=2.6",
    "google-genai>=0.3.0",
    "groq>=0.9.0",
    "youtube-transcript-api>=1.0.0",
    "apify-client>=1.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "tenacity>=8.2.3",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adapters", "pipeline", "storage", "bot"]
