# Postgres + pgvector for the test suite.
#   docker compose -f docker-compose.test.yml up -d
#   python -m pytest
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: recall_test
      POSTGRES_PASSWORD: recall_test
      POSTGRES_DB: recall_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recall_test"]
      interval: 2s
      timeout: 3s
      retries: 15
